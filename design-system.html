<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIDEFORM® — Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f3ef;
      --white: #ffffff;
      --ink: #111111;
      --panel: #151515;
      --panel-2: #1b1b1b;
      --coral: #ff5a45;
      --rule-l: rgba(17, 17, 17, 0.18);
      --rule-d: rgba(255, 255, 255, 0.16);
      --soft: rgba(17, 17, 17, 0.38);
      --soft-d: rgba(255, 255, 255, 0.45);
      --gutter: clamp(18px, 2.5vw, 52px);
      --colgap: clamp(10px, 1.1vw, 22px);
      --font-sans: "Helvetica Neue", "Inter Tight", Inter, "Suisse Int'l", -apple-system, Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: #111111;
      color: var(--white);
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .nav {
      position: relative;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px var(--gutter);
      background: #111111;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      flex-shrink: 0;
    }
    .nav__logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav__menu {
      display: flex;
      gap: clamp(16px, 2.5vw, 36px);
      list-style: none;
    }
    .nav__menu a {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      opacity: 0.7;
      padding: 6px 0;
      position: relative;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .nav__menu a:hover:not(.is-disabled) {
      opacity: 1;
    }
    .nav__menu a.is-active {
      opacity: 1;
      color: var(--coral);
    }
    .nav__menu a.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: var(--coral);
    }
    .nav__menu a.is-disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    .nav__cta {
      background: var(--coral);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px 14px;
      border-radius: 2px;
      user-select: none;
      cursor: default;
    }
    .nav__right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .catalog-content {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    .catalog-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav" id="nav">
      <a class="nav__logo" href="#overview">
        RIDEFORM
        <sup style="font-size:0.55em">®</sup>
      </a>

      <nav>
        <ul class="nav__menu">
          <li><a href="#overview" id="navOverview" class="is-active">Overview</a></li>
          <li><a href="#components" id="navComponents" class="is-disabled" title="Disponível após aprovação do Overview">Components</a></li>
        </ul>
      </nav>

      <div class="nav__right">
        <span class="nav__cta">Design System</span>
      </div>
    </header>

    <main class="catalog-content">
      <iframe
        id="overviewFrame"
        class="catalog-iframe"
        src="assets/overview/index.html"
        title="Rideform Design System Overview"
      ></iframe>
    </main>
  </div>

  <script>
    (function () {
      function syncRouting() {
        var hash = window.location.hash || '#overview';
        if (hash === '#components') {
          window.location.hash = '#overview';
          return;
        }
        var overviewLink = document.getElementById('navOverview');
        var componentsLink = document.getElementById('navComponents');
        if (overviewLink) overviewLink.classList.add('is-active');
        if (componentsLink) componentsLink.classList.remove('is-active');
      }

      window.addEventListener('hashchange', syncRouting);
      if (!window.location.hash) {
        history.replaceState(null, '', '#overview');
      }
      syncRouting();
    })();
  </script>
</body>
</html>
