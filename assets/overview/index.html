    doc.querySelectorAll('meta[http-equiv]').forEach(function (m) {
      if (/content-security-policy|refresh/i.test(m.getAttribute('http-equiv'))) m.remove();
    });
    importMap(doc);
    rewriteTree(doc);
    var root = doc.documentElement;
    var attrs = Array.prototype.map.call(root.attributes, function (a) {
      return ' ' + a.name + '="' + a.value.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"';
    }).join('');
    W.__wd3Booted = true;
    var me = D.currentScript;
    if (me) me.remove();
    D.write('<html' + attrs + '>' + root.innerHTML + '</html>');
  }

  try {
    boot();
  } catch (err) {
    W.__wd3BootError = String(err && err.stack || err);
    D.write('<p style="font:15px system-ui,sans-serif;padding:24px">Website Downloader 3.0: não foi possível ' +
      'montar a página a partir deste arquivo (' + String(err && err.message || err).replace(/</g, '&lt;') + ').</p>');
  }
})();
</script>
